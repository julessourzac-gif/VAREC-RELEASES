name: update-version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à appliquer (ex: v1.4.25)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Check arm64 asset exists
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          VER="${TAG#v}"
          HAS_ARM64=$(gh release view "$TAG" \
            --repo ${{ github.repository }} \
            --json assets --jq \
            "[.assets[].name | select(endswith(\"-arm64.dmg\"))] | length > 0")
          HAS_INTEL=$(gh release view "$TAG" \
            --repo ${{ github.repository }} \
            --json assets --jq \
            "[.assets[].name | select(endswith(\".dmg\") and (endswith(\"-arm64.dmg\") | not))] | length > 0")
          echo "arm64=$HAS_ARM64" >> $GITHUB_OUTPUT
          echo "intel=$HAS_INTEL" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Update version in index.html + en/index.html
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VER: ${{ steps.assets.outputs.ver }}
          HAS_ARM64: ${{ steps.assets.outputs.arm64 }}
          HAS_INTEL: ${{ steps.assets.outputs.intel }}
        run: |
          # Deux dates : le bandeau français est en toutes lettres françaises,
          # l'anglais suit en-GB, comme localeDate() dans script.js.
          DATE_FR=$(python3 -c "
          import datetime
          months = ['janvier','février','mars','avril','mai','juin',
                    'juillet','août','septembre','octobre','novembre','décembre']
          d = datetime.date.today()
          print(f'{d.day} {months[d.month-1]} {d.year}')
          ")
          DATE_EN=$(python3 -c "
          import datetime
          months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December']
          d = datetime.date.today()
          print(f'{d.day} {months[d.month-1]} {d.year}')
          ")

          python3 <<PYEOF
          import re, os

          tag      = os.environ['TAG']
          ver      = os.environ['VER']
          has_arm  = os.environ['HAS_ARM64'] == 'true'
          has_intel = os.environ['HAS_INTEL'] == 'true'

          # Chaque locale a sa page, son libellé de bandeau et sa date. Le reste
          # des motifs (CTA, liens de téléchargement) est identique d'une langue
          # à l'autre : la page anglaise est une jumelle structurelle de la
          # française, seul le texte diffère.
          PAGES = [
              ('index.html',    'Dernière version : ', '$DATE_FR'),
              ('en/index.html', 'Latest version: ',    '$DATE_EN'),
          ]

          # Le bandeau ne s'avance jamais devant les liens. Il était mis à jour
          # inconditionnellement alors que les liens attendaient, eux, la
          # présence d'un DMG : une release publiée sans binaire faisait donc
          # annoncer par la page une version qu'elle ne pouvait pas servir
          # (bandeau v1.5.38, liens v1.5.35). C'est l'écart constaté en
          # production sur v1.5.36, v1.5.37 et v1.5.38.
          if not (has_arm or has_intel):
              print(f'::warning::{tag} publiée sans DMG macOS — pages laissées inchangées')
              print(f'index.html, en/index.html → inchangés (aucun binaire à servir pour {tag})')
          else:
              for path, label, date in PAGES:
                  with open(path, 'r') as f:
                      html = f.read()

                  html = re.sub(r'↓ v[\d.]+', f'↓ {tag}', html)
                  html = re.sub(r'v[\d.]+ · macOS', f'{tag} · macOS', html)
                  html = re.sub(
                      re.escape(label) + r'v[\d.]+ · [^<]+',
                      f'{label}{tag} · {date}',
                      html
                  )

                  # Lien arm64 — seulement si le DMG existe dans cette release
                  if has_arm:
                      html = re.sub(
                          r'releases/download/v[\d.]+/VAREC-[\d.]+-arm64\.dmg',
                          f'releases/download/{tag}/VAREC-{ver}-arm64.dmg',
                          html
                      )

                  # Lien Intel — seulement si DMG Intel présent dans cette release
                  if has_intel:
                      html = re.sub(
                          r'releases/download/v[\d.]+/VAREC-[\d.]+\.dmg',
                          f'releases/download/{tag}/VAREC-{ver}.dmg',
                          html
                      )

                  with open(path, 'w') as f:
                      f.write(html)

                  print(f'{path} → {tag} ({date})')

              arm_status  = '✓ mis à jour' if has_arm  else '— inchangé (pas de DMG arm64)'
              intel_status = '✓ mis à jour' if has_intel else '— inchangé (pas de DMG Intel)'
              print(f'  arm64  : {arm_status}')
              print(f'  intel  : {intel_status}')
          PYEOF

      - name: Commit and push
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html
          git diff --cached --quiet && echo "Rien à committer" && exit 0
          git commit -m "chore: bump version to $TAG"
          git pull --rebase origin main
          git push origin main

      # Trois releases (v1.5.36, v1.5.37, v1.5.38) sont parties sans binaire
      # sans que rien ne le signale : le job restait vert, la page continuait
      # de servir v1.5.35. Une release macOS sans DMG est un échec de
      # publication, elle doit teindre le run en rouge et notifier.
      - name: Fail if release ships no macOS DMG
        if: steps.assets.outputs.arm64 != 'true' && steps.assets.outputs.intel != 'true'
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "::error::$TAG publiée sans aucun DMG macOS — les binaires ne sont pas remontés depuis le dépôt privé VAREC."
          exit 1
