name: update-manual

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release à analyser (ex: v1.4.36)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install --quiet 'anthropic>=0.40'

      - name: Resolve tag and previous tag
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          PREV=$(gh release list --repo ${{ github.repository }} \
            --limit 50 --json tagName --jq '.[].tagName' \
            | grep -v "^${TAG}$" | head -1 || true)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prev=$PREV" >> $GITHUB_OUTPUT

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          NOTES=$(gh release view "$TAG" --repo ${{ github.repository }} \
            --json body --jq '.body' 2>/dev/null || echo "")
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Fetch source diff from private repo
        id: diff
        env:
          GH_TOKEN: ${{ secrets.VAREC_PRIVATE_PAT }}
          TAG: ${{ steps.vars.outputs.tag }}
          PREV: ${{ steps.vars.outputs.prev }}
        run: |
          if [ -z "$PREV" ]; then
            SUMMARY="(pas de release précédente trouvée)"
          else
            SUMMARY=$(gh api "repos/julessourzac-gif/VAREC/compare/${PREV}...${TAG}" \
              --jq '{
                commits: [.commits[].commit.message],
                files: [.files[] | {f: .filename, status: .status, additions: .additions, deletions: .deletions}]
              }' 2>/dev/null || echo "(diff inaccessible)")
          fi
          {
            echo "summary<<SOURCE_DIFF_EOF"
            echo "$SUMMARY"
            echo "SOURCE_DIFF_EOF"
          } >> $GITHUB_OUTPUT

      - name: Propose manual edits via Claude
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ steps.vars.outputs.tag }}
          PREV_TAG: ${{ steps.vars.outputs.prev }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
          SOURCE_DIFF: ${{ steps.diff.outputs.summary }}
        run: python3 .github/scripts/update_manual.py

      - name: Open pull request
        if: steps.claude.outputs.MANUAL_UPDATED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          BRANCH="auto/manual-update-${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add manuel.html
          git commit -m "docs: update manuel.html for $TAG"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: update manuel.html for $TAG" \
            --body-file /tmp/manual_update_summary.md

      - name: Log no-op
        if: steps.claude.outputs.MANUAL_UPDATED != 'true'
        run: |
          echo "Aucune mise à jour du manuel proposée pour ${{ steps.vars.outputs.tag }}."
          cat /tmp/manual_update_summary.md || true
